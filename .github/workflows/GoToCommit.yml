# GotoCommit[86bcf8c]

name: Build APK 

# Only activates when you commit this file
on:
  push:
    paths:
      - '.github/workflows/GoToCommit.yml'

# Constants used in code
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CurrentFile: '.github/workflows/GoToCommit.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Go to commit
        shell: bash
        run: |
          set -euo pipefail

          FILE="$CurrentFile"

          echo "::group::Reading target commit"
          echo "Control file: $FILE"

          COMMIT=$(grep -oP 'GotoCommit\[\K[^\]]*' "$FILE" | head -n 1 | tr -d '[:space:]' || true)

          if [ -z "$COMMIT" ]; then
            echo "No GotoCommit value found. Keeping current checkout."
            exit 0
          fi

          echo "Target commit: $COMMIT"
          echo "::endgroup::"

          echo "::group::Fetching repository history"
          git fetch --no-tags --unshallow origin || true
          git fetch --no-tags origin
          git cat-file -e "$COMMIT^{commit}"
          echo "Target commit exists locally."
          echo "::endgroup::"

          echo "::group::Checking out target commit"
          git checkout --detach "$COMMIT"

          ACTUAL=$(git rev-parse HEAD)
          TARGET=$(git rev-parse "$COMMIT")

          echo "Target:   $TARGET"
          echo "Checked out: $ACTUAL"

          if [ "$ACTUAL" != "$TARGET" ]; then
            echo "::error::Checkout verification failed!"
            exit 1
          fi

          echo "Verified: repository is now at the requested commit."
          echo "Working directory: $(pwd)"
          echo "Subsequent steps will use this checkout unless they change it."
          echo "::endgroup::"
