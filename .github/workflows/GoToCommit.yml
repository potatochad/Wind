# GotoCommit[86bcf8c]

name: Build APK 

# Only activates when you commit this file
on:
  push:
    paths:
      - '.github/workflows/GoToCommit.yml'

# Constants used in code
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CurrentFile: '.github/workflows/GoToCommit.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Go to commit
        shell: bash
        run: |
          source .github/workflows/Imports.sh
          GoToCommit "$CurrentFile"
