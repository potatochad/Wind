# GotoCommit[86bcf8c]

name: Build APK 

# Only activates when you commit this file
on:
  push:
    paths:
      - '.github/workflows/GoToCommit.yml'

# Constants used in code
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CurrentFile: '.github/workflows/GoToCommit.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Go to commit
        shell: bash
        run: |
          FILE="$CurrentFile"

          echo "Checking file: $FILE"

          COMMIT=$(grep -oP 'GotoCommit\[\K[^\]]*' "$FILE" | head -n 1 | tr -d '[:space:]')

          if [ -n "$COMMIT" ]; then
            echo "Target commit found: $COMMIT"

            echo "Fetching repository history..."
            git fetch --no-tags --unshallow origin || true
            git fetch --no-tags origin

            echo "Checking out commit: $COMMIT"
            git checkout --detach "$COMMIT"

            echo "Successfully checked out $COMMIT"
            echo "Continuing to subsequent workflow steps."
          else
            echo "No GotoCommit value found. Keeping current checkout."
          fi


          
