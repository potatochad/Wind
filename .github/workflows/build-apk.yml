# GotoCommit[86bcf8c]

name: Build APK

on: push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # <- force Node 24 for all JS actions


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Go to commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=".github/workflows/build-apk.yml"
          COMMIT=$(grep -oP 'GotoCommit\[\K[^\]]*' "$FILE" | head -n 1 | tr -d '[:space:]')

          if [ -n "$COMMIT" ]; then
            git fetch --no-tags --unshallow origin || true
            git fetch --no-tags origin
            git checkout --detach "$COMMIT"

            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-
             


      - name: Build APK
        run: |
          source .github/workflows/Imports.sh
          give_gradle_permission

          Build_APK


      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release-${{ github.run_number }}.apk
          path: app/build/outputs/apk/release/app-release.apk




          
